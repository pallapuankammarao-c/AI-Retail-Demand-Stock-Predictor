services:
  # Backend FastAPI Web Service
  - type: web
    name: retailpulse-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_URL
        fromDatabase:
          name: retailpulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  # Frontend Static Site
  - type: web
    name: retailpulse-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: retailpulse-db
    databaseName: retailpulse
    user: retailadmin
    plan: free
