version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: retailpulse-db
    environment:
      POSTGRES_USER: retailadmin
      POSTGRES_PASSWORD: secure_retail_password_2026
      POSTGRES_DB: retailpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailadmin -d retailpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailpulse-backend
    environment:
      - DATABASE_URL=postgresql://retailadmin:secure_retail_password_2026@db:5432/retailpulse
      - SECRET_KEY=retailpulse-production-super-secret-key
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
