<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=http://localhost:8000/">
  <title>RetailPulse AI - Launching Dashboard...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b0f17;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
    code {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🛒 RetailPulse AI</h1>
    <p>Redirecting you to the unified dashboard at <strong>http://localhost:8000</strong>...</p>
    <a href="http://localhost:8000/" class="btn">Tap to Open Dashboard</a>
    <div class="note">
      If the page does not load, make sure the server is running by double-clicking <code>start_app.bat</code> in the project folder.
    </div>
  </div>
  <script>
    window.location.href = "http://localhost:8000/";
  </script>
</body>
</html>
